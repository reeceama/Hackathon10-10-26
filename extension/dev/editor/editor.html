<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Referee</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header>
      <div class="brand">Referee <span class="server" id="server" data-state="checking">Connecting…</span></div>
      <div id="research-banner" class="banner off">
        <span id="research-text">Research mode is off</span>
        <button id="research-toggle">Start</button>
      </div>
    </header>

    <main>
      <section class="page">
        <input id="title" placeholder="Essay title" />
        <div class="writing">
          <div id="backdrop" aria-hidden="true"></div>
          <textarea id="editor" spellcheck="true" placeholder="Start writing. Sentences are checked against your reading as you finish them."></textarea>
        </div>
        <footer id="summary"></footer>
        <div class="proof"><button id="proof" class="copy">Proof of work report</button></div>
        <section class="refs" id="refs" hidden>
          <div class="refs-head">
            <h2>References</h2>
            <div class="refs-tools">
              <select id="citation-style" aria-label="Citation style">
                <option value="apa">APA 7</option>
                <option value="harvard">Harvard</option>
                <option value="mla">MLA 9</option>
                <option value="chicago">Chicago</option>
                <option value="ieee">IEEE (numbered)</option>
                <option value="ams">AMS (numbered)</option>
                <option value="vancouver">Vancouver (numbered)</option>
              </select>
              <button class="copy" id="copy-refs">Copy references</button>
            </div>
          </div>
          <ol id="ref-list"></ol>
        </section>
      </section>

      <aside>
        <h2>Sources</h2>
        <p id="empty" class="hint">Citations and warnings appear here as you write.</p>
        <div id="cards"></div>
      </aside>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../../library/cite.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
