<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, "Segoe UI", sans-serif; width: 260px; margin: 0; padding: 14px; color: #222; }
      h1 { font-size: 16px; margin: 0 0 2px; }
      .tagline { font-size: 12px; color: #666; margin: 0 0 14px; }
      .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
      select { font-size: 13px; }
      #status { font-size: 12px; color: #111; margin: 4px 0 12px; min-height: 16px; }
      #status.off { color: #888; }
      button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #111; color: white; font-size: 13px; cursor: pointer; }
      .switch { position: relative; width: 38px; height: 22px; }
      .switch input { display: none; }
      .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; cursor: pointer; transition: 0.2s; }
      .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.2s; }
      input:checked + .slider { background: #111; }
      input:checked + .slider::before { transform: translateX(16px); }
    </style>
  </head>
  <body>
    <h1>Referee</h1>
    <p class="tagline">Checks your writing against what you've read.</p>

    <div class="row">
      <span>Research mode</span>
      <label class="switch"><input type="checkbox" id="research" /><span class="slider"></span></label>
    </div>
    <div class="row">
      <span>Turn off after</span>
      <select id="duration">
        <option value="60">1 hour</option>
        <option value="180">3 hours</option>
        <option value="0">Never</option>
      </select>
    </div>
    <div class="row">
      <span>Start automatically</span>
      <select id="mode">
        <option value="manual">Manually only</option>
        <option value="auto">When I write</option>
      </select>
    </div>
    <div id="status"></div>
    <button id="open-editor">Open editor</button>
    <script src="popup.js"></script>
  </body>
</html>
