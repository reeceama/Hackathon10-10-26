<!doctype html>
<html>
  <head>
    <base target="_top" />
    <style>
      body { font-family: Arial, sans-serif; font-size: 13px; margin: 12px; color: #202124; }
      h1 { font-size: 16px; margin: 0 0 2px; }
      .muted { color: #5f6368; font-size: 12px; }
      .bad { color: #c5221f; }
      label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
      select, input[type=text] { font-size: 13px; width: 130px; }
      button { font-size: 13px; padding: 6px 10px; margin: 4px 4px 0 0; cursor: pointer; }
      .card { border: 1px solid #dadce0; border-left: 4px solid #dadce0; border-radius: 6px; padding: 8px; margin-top: 8px; }
      .card.supports { border-left-color: #1e8e3e; } .card.contradicts { border-left-color: #d93025; }
      .card.misquote, .card.needs { border-left-color: #e37400; }
      .card .label { font-weight: bold; } .card .sentence { color: #5f6368; margin: 4px 0; }
      .card .quote { font-style: italic; } .card .warning { color: #b06000; margin-top: 4px; }
    </style>
  </head>
  <body>
    <h1>Referee</h1>
    <div class="muted" id="status">Connecting…</div>
    <label><span><input type="checkbox" id="auto" checked /> Check as I write</span></label>
    <label>Referencing style
      <select id="style">
        <option value="apa">APA 7</option><option value="harvard">Harvard</option><option value="mla">MLA 9</option>
        <option value="ieee">IEEE (numbered)</option><option value="ams">AMS (numbered)</option>
      </select>
    </label>
    <label>Project <input type="text" id="project" placeholder="All reading" /></label>
    <button id="check">Check now</button><button id="clear">Clear colours</button>
    <div id="cards"></div>

    <?!= include("Cite"); ?>
    <script>
      // Keep this sidebar open while writing: Docs only runs add-ons while their sidebar is open.
      const SERVER = "http://localhost:8000";
      const HEADERS = { "Content-Type": "application/json", "X-Referee": "1" };
      const EVERY_MS = 4000;
      const MIN_WORDS = 5;
      const SENTENCE = /[^.!?]+[.!?]+["”’)\]]*/g;
      const LABELS = { supports: "Supported", contradicts: "Your source says otherwise", misquote: "Misquote" };

      const checked = new Map();  // sentence -> server reply
      let numbers = {};
      let lastPing = 0;
      let busy = false;

      const $ = (id) => document.getElementById(id);
      const run = (name, ...args) => new Promise((resolve, reject) =>
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
      const style = () => Cite.STYLES[$("style").value] || Cite.STYLES.apa;
      const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

      async function api(path, body) {
        const response = await fetch(SERVER + path, { method: body ? "POST" : "GET", headers: HEADERS, body: body && JSON.stringify(body) });
        return response.json();
      }

      function numberFor(source) {
        const key = source.url || source.title || "";
        if (!numbers[key]) numbers[key] = Object.keys(numbers).length + 1;
        return numbers[key];
      }

      function citation(match) {
        return style().inText(match.source, { number: numberFor(match.source), page: match.page, time: match.time });
      }

      function warnings(m) {
        const notes = [];
        if (m.misquote && m.label !== "misquote") notes.push("This quotation doesn't match the source exactly.");
        if (m.too_close) notes.push("Very close to the source's wording. Consider quoting it or rephrasing.");
        for (const c of (m.changes || []).slice(0, 3)) notes.push(c.wrote && c.source ? `You quoted “${c.wrote}”; the source says “${c.source}”.` : c.wrote ? `“${c.wrote}” isn't in the source's wording.` : `You left out “${c.source}”.`);
        for (const n of m.wrong_numbers || []) notes.push(`“${n}” doesn't appear in the source. Check the figure.`);
        if (m.together_with) notes.push(`This claim combines two sources: also cite ${Cite.cleanTitle(m.together_with.source || {})}.`);
        if (m.mixed) notes.push(`Mixed evidence: ${Cite.cleanTitle(m.mixed)} points the other way.`);
        const year = parseInt(String(m.source?.date || ""), 10);
        if (m.label === "supports" && year && new Date().getFullYear() - year > 10) notes.push(`This source is from ${year}. Check whether newer evidence agrees.`);
        return notes;
      }

      function render() {
        const html = [];
        for (const [sentence, r] of [...checked].reverse()) {
          if (!r || (!r.match && !r.needs_source)) continue;
          const short = sentence.length > 90 ? sentence.slice(0, 90) + "…" : sentence;
          if (!r.match) {
            const near = (r.closest || []).map((c) => c.title || c.url).join("; ");
            html.push(`<div class="card needs"><div class="label">Needs a source</div><div class="sentence">${esc(short)}</div>
              ${near ? `<div class="muted">Closest in your reading: ${esc(near)}</div>` : ""}</div>`);
            continue;
          }
          html.push(`<div class="card ${r.label}"><div class="label">${LABELS[r.label] || r.label}</div>
            <div class="sentence">${esc(short)}</div><div class="quote">“${esc(r.quote)}”</div>
            <div class="muted">${esc(Cite.cleanTitle(r.source || {}))}</div>
            ${warnings(r).map((w) => `<div class="warning">${esc(w)}</div>`).join("")}</div>`);
        }
        $("cards").innerHTML = html.join("") || `<p class="muted">Claims your reading backs or contradicts appear here as you write.</p>`;
      }

      async function checkDocument() {
        if (busy) return;
        busy = true;
        try {
          const text = await run("documentText");
          if (Date.now() - lastPing > 60000) {
            lastPing = Date.now();
            api("/writing", {}).catch(() => {});
          }
          const sentences = (text.match(SENTENCE) || []).map((s) => s.trim()).filter((s) => s.split(/\s+/).length >= MIN_WORDS);
          const fresh = sentences.filter((s) => !checked.has(s));
          let cited = false;
          for (const sentence of fresh) {
            const r = await api("/check", { sentence, project: $("project").value.trim() });
            checked.set(sentence, r);
            if (r.match) {
              const warn = r.label === "supports" && (r.misquote || r.too_close);
              const kind = warn ? "warn" : r.label === "misquote" ? "warn" : r.label;
              const cite = r.label === "supports" && !sentence.includes(citation(r)) ? citation(r) : null;
              await run("markSentence", sentence, kind, cite);
              if (cite) {
                checked.set(sentence.replace(/([.!?]+["”’)\]]*)$/, ` ${cite}$1`), r);  // the edited sentence is already checked
                cited = true;
              }
            } else if (r.needs_source) {
              await run("markSentence", sentence, "needs", null);
            }
          }
          if (cited) {
            await run("setNumbers", numbers);
            await updateReferences();
          }
          $("status").textContent = `Checked ${checked.size} sentence${checked.size === 1 ? "" : "s"}.`;
          $("status").className = "muted";
          render();
        } catch (error) {
          $("status").textContent = "Can't reach the Referee server on this computer. Is it running?";
          $("status").className = "muted bad";
        } finally {
          busy = false;
        }
      }

      async function updateReferences() {
        const sources = new Map();
        for (const r of checked.values()) if (r?.match && r.label === "supports") sources.set(r.source.url, r.source);
        let list = [...sources.values()];
        list = style().numbered ? list.sort((a, b) => numberFor(a) - numberFor(b)) : list.sort((a, b) => Cite.sortKey(a).localeCompare(Cite.sortKey(b)));
        const heading = $("style").value === "mla" ? "Works Cited" : $("style").value === "harvard" ? "Reference list" : "References";
        await run("addReferences", heading, list.map((s) => style().reference(s, { number: numberFor(s) })));
      }

      async function saveSettings() {
        await run("saveSettings", { style: $("style").value, project: $("project").value.trim() });
      }

      $("check").onclick = checkDocument;
      $("clear").onclick = () => run("clearMarks");
      $("style").onchange = saveSettings;
      $("project").onchange = () => { checked.clear(); saveSettings(); };

      Promise.all([run("getSettings"), run("getNumbers")]).then(([settings, saved]) => {
        $("style").value = settings.style;
        $("project").value = settings.project;
        numbers = saved || {};
        checkDocument();
        setInterval(() => { if ($("auto").checked) checkDocument(); }, EVERY_MS);
      });
    </script>
  </body>
</html>
